name: Continuous Integration

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

jobs:
    format:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout sources
              uses: actions/checkout@v6
            - name: Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt
            - name: Cargo cache
              uses: actions/cache@v5
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
            - name: Format
              run: cargo +stable fmt --all -- --check

    clippy-check:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout sources
              uses: actions/checkout@v6
            - name: Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy
            - name: Cargo cache
              uses: actions/cache@v5
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
            - name: System dependencies
              run: sudo apt-get update; sudo apt-get install libudev-dev libgbm-dev libxkbcommon-dev libegl1-mesa-dev libwayland-dev libinput-dev libdbus-1-dev libsystemd-dev libseat-dev libdisplay-info-dev protobuf-compiler
            - name: Clippy
              run: cargo +stable clippy --all-features -- -D warnings

    check-features:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout sources
              uses: actions/checkout@v6
            - name: Rust toolchain
              uses: dtolnay/rust-toolchain@stable
            - name: Cargo cache
              uses: actions/cache@v5
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
            - name: System dependencies
              run: sudo apt-get update; sudo apt-get install libudev-dev libgbm-dev libxkbcommon-dev libegl1-mesa-dev libwayland-dev libinput-dev libdbus-1-dev libsystemd-dev libseat-dev libdisplay-info-dev protobuf-compiler
            - run: cargo +stable check --no-default-features
            - run: cargo +stable check --features debug
            - run: cargo +stable check --features profile-with-tracy
            - run: cargo +stable check --features profile-with-tracy-gpu

    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout sources
              uses: actions/checkout@v6
            - name: Rust toolchain
              uses: dtolnay/rust-toolchain@stable
            - name: Cargo cache
              uses: actions/cache@v5
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
            - name: System dependencies
              run: sudo apt-get update; sudo apt-get install libudev-dev libgbm-dev libxkbcommon-dev libegl1-mesa-dev libwayland-dev libinput-dev libdbus-1-dev libsystemd-dev libdisplay-info-dev protobuf-compiler libpixman-1-dev meson ninja-build
            - name: Build cache
              uses: actions/cache@v5
              with:
                  path: target
                  key: ${{ runner.os }}-build-${{ hashFiles('**/Cargo.toml') }}
            - name: Build and install Libseat
              run: |
                  wget https://git.sr.ht/~kennylevinsen/seatd/archive/0.9.1.tar.gz -O libseat-source.tar.gz
                  tar xf libseat-source.tar.gz
                  cd seatd-0.9.1
                  meson setup -Dlibseat-builtin=enabled -Dserver=disabled -Dexamples=disabled -Dman-pages=disabled build .
                  ninja -C build
                  sudo meson install -C build
                  sudo ldconfig
            - name: Test features
              env:
                  RUST_BACKTRACE: full
              run: cargo test --all-features
    # Every job above compiles the compositor. None of them starts it, and a
    # compositor that builds and does not come up is green on all of them - while
    # taking the project's only visual channel with it. `dev/smoke.sh` boots it
    # under Xvfb (the X11 backend fails on DRI3 and winit falls back to Mesa's
    # software rasteriser, measured 8 Sep), connects the in-repo test client, and
    # captures a frame. It fails on a timeout, never on a pixel: this job exists
    # to catch "it does not start", not to review the picture.
    smoke:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout sources
              uses: actions/checkout@v6
            - name: Rust toolchain
              uses: dtolnay/rust-toolchain@stable
            - name: Cargo cache
              uses: actions/cache@v5
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
            - name: System dependencies
              run: sudo apt-get update; sudo apt-get install -y libudev-dev libgbm-dev libxkbcommon-dev libegl1-mesa-dev libwayland-dev libinput-dev libdbus-1-dev libsystemd-dev libseat-dev libdisplay-info-dev protobuf-compiler xvfb x11-utils grim
            - name: Build the compositor and the test client
              run: cargo build --bin cosmic-comp --bin test-client --features test-client
            - name: Does it start
              run: XDG_RUNTIME_DIR=$(mktemp -d) dev/smoke.sh smoke.png
            - name: Keep the frame
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: smoke-frame
                  path: smoke.png
                  if-no-files-found: warn
    # REUSE 3.3, the same gate the monorepo runs. This fork mixes upstream's
    # GPL-3.0-only, our own additions and a vendored file or two, which is the
    # mixture that goes wrong quietly. Licensing is stated in REUSE.toml by path
    # rather than by per-file header, so upstream's files carry no licence line
    # for a weekly merge to conflict on; see the comment in that file.
    license:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout sources
              uses: actions/checkout@v6
            - name: Install reuse
              run: pipx install reuse
            - name: Licence gate
              run: dev/check-licenses.sh
